name: Update XP in README

on:
  schedule:
    - cron: '0 12 28 * *'  # Executa dia 28 de cada mês às 12:00 UTC
  workflow_dispatch:  # Permite execução manual

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Update XP
        run: |
          python3 << EOF
          import re
          from datetime import datetime

          def calcular_xp():
              hoje = datetime.now()
              inicio = datetime(2019, 1, 28)
              anos = hoje.year - inicio.year
              if (hoje.month, hoje.day) < (inicio.month, inicio.day):
                  anos -= 1
              return anos

          xp = calcular_xp()

          with open('README.md', 'r') as f:
              content = f.read()

          # Marcador é preservado a cada execução, então o job continua
          # idempotente ano após ano (nunca "consome" o placeholder).
          content = re.sub(r'(<!--XP-->)\d+(<!--/XP-->)', rf'\g<1>{xp}\g<2>', content)

          with open('README.md', 'w') as f:
              f.write(content)

          print(f"XP atualizado para: {xp} anos")
          EOF

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "📈 Atualiza XP para $(date +%Y)"
          git push